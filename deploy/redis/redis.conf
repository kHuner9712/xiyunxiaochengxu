bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
databases 16
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data
maxmemory 256mb
# This Redis stores sessions, distributed locks and idempotency facts in addition to caches.
# Evicting arbitrary keys can turn a safe retry into a duplicate asset/order mutation. Under
# memory pressure fail writes explicitly instead of silently deleting correctness-critical keys.
maxmemory-policy noeviction
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
