services:
  mysql:
    image: mysql:8.0
    container_name: baby-mall-mysql
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      MYSQL_DATABASE: ${DB_NAME:-baby_mall}
      MYSQL_CHARSET: utf8mb4
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - baby-mall-network

  redis:
    image: redis:7-alpine
    container_name: baby-mall-redis
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - ./scripts/redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    entrypoint: ["sh", "/usr/local/bin/redis-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "sh", "-c", "value=$$(cat /proc/sys/vm/overcommit_memory 2>/dev/null || echo unreadable); [ \"$$value\" = 1 ] || { echo \"vm.overcommit_memory=$$value; Redis requires 1\" >&2; exit 1; }; REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - baby-mall-network

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        BUILD_SHA: ${BUILD_SHA:-unknown}
    container_name: baby-mall-api
    restart: always
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      PORT: 3000
      API_DOMAIN: ${API_DOMAIN:-api.yunxixiaochengxu.com.cn}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.yunxixiaochengxu.com.cn}
      HTTP_HOST_PORT: ${HTTP_HOST_PORT:-80}
      HTTPS_HOST_PORT: ${HTTPS_HOST_PORT:-443}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-baby_mall}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      WECHAT_APP_ID: ${WECHAT_APP_ID:?WECHAT_APP_ID required}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?WECHAT_APP_SECRET required}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:?WECHAT_MCH_ID required}
      WECHAT_MCH_SERIAL_NO: ${WECHAT_MCH_SERIAL_NO:-}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY:?WECHAT_API_V3_KEY required}
      WECHAT_PRIVATE_KEY_PATH: ${WECHAT_PRIVATE_KEY_PATH:-/app/apps/api/certs/apiclient_key.pem}
      WECHAT_PLATFORM_CERT_PATH: ${WECHAT_PLATFORM_CERT_PATH:-/app/apps/api/certs/wechatpay_platform.pem}
      WECHAT_PLATFORM_CERT_SERIAL_NO: ${WECHAT_PLATFORM_CERT_SERIAL_NO:-}
      WECHAT_PLATFORM_CERT_MAP: ${WECHAT_PLATFORM_CERT_MAP:-}
      WECHAT_SKIP_VERIFY: ${WECHAT_SKIP_VERIFY:-false}
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL:?WECHAT_NOTIFY_URL required}
      WECHAT_REFUND_NOTIFY_URL: ${WECHAT_REFUND_NOTIFY_URL:?WECHAT_REFUND_NOTIFY_URL required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS required}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      UPLOAD_DIR: /app/apps/api/uploads
      RUN_SEED: ${RUN_SEED:-false}
      SKIP_MIGRATE: ${SKIP_MIGRATE:-false}
      ADMIN_DEFAULT_USERNAME: ${ADMIN_DEFAULT_USERNAME:-admin}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?ADMIN_DEFAULT_PASSWORD required}
      SMOKE_TEST_BYPASS_CAPTCHA: ${SMOKE_TEST_BYPASS_CAPTCHA:-false}
      UPLOAD_PUBLIC_URL: ${UPLOAD_PUBLIC_URL:?UPLOAD_PUBLIC_URL required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OUTBOUND_HTTP_TIMEOUT_MS: ${OUTBOUND_HTTP_TIMEOUT_MS:-10000}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET required}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_ADMIN_EXPIRES_IN: ${JWT_ADMIN_EXPIRES_IN:-2h}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-52428800}
      UPLOAD_ALLOWED_TYPES: ${UPLOAD_ALLOWED_TYPES:-image/jpeg,image/png,image/gif,image/webp,video/mp4}
    volumes:
      - upload_data:/app/apps/api/uploads
      - log_data:/app/apps/api/logs
      - ./certs:/app/apps/api/certs:ro
      - admin_dist:/usr/share/nginx/admin
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - baby-mall-network

  nginx:
    image: nginx:alpine
    container_name: baby-mall-nginx
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "${HTTP_HOST_PORT:-80}:80"
      - "${HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - admin_dist:/usr/share/nginx/admin:ro
      - upload_data:/usr/share/nginx/uploads:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - baby-mall-network

volumes:
  mysql_data:
  redis_data:
  upload_data:
  log_data:
  admin_dist:

networks:
  baby-mall-network:
    driver: bridge
