name: API Open Handle Diagnostic

on:
  pull_request:
    branches: [main, develop]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PRISMA_SKIP_POSTINSTALL_GENERATE: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false
          standalone: true

      - name: Setup Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @baby-mall/shared build

      - name: Generate Prisma Client
        run: pnpm --filter @baby-mall/api prisma:generate

      - name: Detect API unit-test open handles
        id: detect-handles
        run: |
          set -o pipefail
          timeout 120s pnpm --filter @baby-mall/api exec jest \
            --config jest.config.js \
            --runInBand \
            --detectOpenHandles \
            --testLocationInResults 2>&1 | tee api-open-handles.log

      - name: Preserve open handle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-open-handles-log
          path: api-open-handles.log
          if-no-files-found: error
          retention-days: 1
