name: API Open Handle Diagnostic

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PRISMA_SKIP_POSTINSTALL_GENERATE: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false
          standalone: true

      - name: Setup Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @baby-mall/shared build

      - name: Generate Prisma Client
        run: pnpm --filter @baby-mall/api prisma:generate

      - name: Detect API unit-test open handles
        id: detect-handles
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 120s pnpm --filter @baby-mall/api exec jest \
            --config jest.config.js \
            --runInBand \
            --detectOpenHandles \
            --testLocationInResults 2>&1 | tee api-open-handles.log

      - name: Isolate hanging API unit-test files
        if: steps.detect-handles.outcome == 'failure'
        id: isolate-handles
        run: |
          set -uo pipefail
          : > api-open-handles-isolation.log
          cd apps/api
          failed=0
          while IFS= read -r spec; do
            echo "===== $spec =====" | tee -a ../../api-open-handles-isolation.log
            set +e
            timeout 30s pnpm exec jest \
              --config jest.config.js \
              --runInBand \
              --detectOpenHandles \
              --runTestsByPath "$spec" \
              --silent 2>&1 | tee -a ../../api-open-handles-isolation.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 124 ]; then
              echo "HANGING_SPEC=$spec" | tee -a ../../api-open-handles-isolation.log
              failed=1
            elif [ "$status" -ne 0 ]; then
              echo "FAILED_SPEC=$spec EXIT=$status" | tee -a ../../api-open-handles-isolation.log
              failed=1
            fi
          done < <(find src -type f -name '*.spec.ts' | sort)
          exit "$failed"

      - name: Preserve open handle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-open-handles-log
          path: |
            api-open-handles.log
            api-open-handles-isolation.log
          if-no-files-found: warn
          retention-days: 1

      - name: Fail when aggregate open-handle diagnostic failed
        if: steps.detect-handles.outcome == 'failure'
        run: exit 1
