name: Repository Audit Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n deploy/scripts/backup.sh
          bash -n deploy/scripts/deploy.sh
          bash -n deploy/scripts/production-smoke.sh

      - name: Validate Nginx configuration
        run: |
          mkdir -p deploy/nginx/ssl/api deploy/nginx/ssl/admin
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=localhost' \
            -keyout deploy/nginx/ssl/api/privkey.pem \
            -out deploy/nginx/ssl/api/fullchain.pem >/dev/null 2>&1
          cp deploy/nginx/ssl/api/privkey.pem deploy/nginx/ssl/admin/privkey.pem
          cp deploy/nginx/ssl/api/fullchain.pem deploy/nginx/ssl/admin/fullchain.pem
          docker run --rm --add-host api:127.0.0.1 \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/deploy/nginx/ssl:/etc/nginx/ssl:ro" \
            nginx:alpine nginx -t

      - name: Run production smoke check
        run: bash deploy/scripts/production-smoke.sh
