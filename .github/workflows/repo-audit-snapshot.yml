name: Repository Audit Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n deploy/scripts/backup.sh
          bash -n deploy/scripts/deploy.sh
          bash -n deploy/scripts/production-smoke.sh

      - name: Run production smoke check
        run: bash deploy/scripts/production-smoke.sh
