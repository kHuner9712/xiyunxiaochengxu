name: API Test CI Diagnostic

on:
  pull_request:
    branches: [main, develop]

jobs:
  test-ci:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: baby_mall_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      PRISMA_SKIP_POSTINSTALL_GENERATE: true
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/baby_mall_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      NODE_ENV: test
      JWT_SECRET: ci-runtime-jwt-secret-not-for-production-2026
      REFRESH_TOKEN_SECRET: ci-runtime-refresh-secret-not-for-production-2026
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false
          standalone: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @baby-mall/shared build
      - name: Generate Prisma Client
        run: pnpm --filter @baby-mall/api prisma:generate
      - name: Run exact API test-ci and preserve full output
        id: test-ci
        shell: bash
        run: |
          set +e
          pnpm --filter @baby-mall/api test:ci > api-test-ci.log 2>&1
          status=$?
          set -e
          cat api-test-ci.log
          exit "$status"
      - name: Preserve exact API test-ci diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-ci-diagnostic-log
          path: api-test-ci.log
          if-no-files-found: error
          retention-days: 1
