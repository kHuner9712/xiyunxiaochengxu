name: Native Control Audit

on:
  push:
    branches:
      - fix/order-video-font-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan miniprogram native controls
        run: python3 scripts/audit-native-controls.py
