name: API Lint Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  api-lint:
    runs-on: ubuntu-latest
    env:
      PRISMA_SKIP_POSTINSTALL_GENERATE: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run API lint
        shell: bash
        run: |
          set +e
          pnpm --filter @baby-mall/api lint 2>&1 | tee api-lint.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload API lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-lint-log
          path: api-lint.log
          if-no-files-found: error
          retention-days: 3
