name: One-shot Member Benefits Patch

on:
  push:
    branches:
      - agent/production-operation-closure-20260807

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: trigger exact member benefits source patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-operation-closure-20260807
          fetch-depth: 0

      - name: Apply exact source transformations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          p = Path('apps/api/src/order/order.service.ts')
          s = p.read_text()
          s = replace_once(
              s,
              "import { FlashSaleService } from '../flash-sale/flash-sale.service';\n",
              "import { FlashSaleService } from '../flash-sale/flash-sale.service';\nimport { calculateMemberDiscountAmount, loadActiveMemberLevels, resolveMemberLevel } from '../member/member-level-runtime';\n",
              'order import member runtime',
          )
          s = replace_once(
              s,
              "      });\n    }\n\n    if (data.couponId) {",
              "      });\n    }\n\n    discountAmount = await this.calculateMemberDiscount(BigInt(userId), totalAmount);\n\n    if (data.couponId) {",
              'order confirm member discount',
          )
          s = replace_once(
              s,
              "      });\n    }\n\n    let couponAmount = 0;",
              "      });\n    }\n\n    const discountAmount = await this.calculateMemberDiscount(BigInt(userId), totalAmount);\n\n    let couponAmount = 0;",
              'order create member discount',
          )
          s = replace_once(
              s,
              "      const pointsBaseAmount = Math.max(0, totalAmount - activityDiscountAmount);",
              "      const pointsBaseAmount = Math.max(0, totalAmount - discountAmount - activityDiscountAmount);",
              'order create points base',
          )
          s = replace_once(
              s,
              "\n    const discountAmount = 0;\n    let freightAmount = 0;",
              "\n    let freightAmount = 0;",
              'order remove legacy zero member discount',
          )
          s = replace_once(
              s,
              "  private calculatePointsDeduction(baseAmount: number, availablePoints: number, requestedPoints: number) {",
              "  private async calculateMemberDiscount(userId: bigint, totalAmount: number): Promise<number> {\n    const user = await this.prisma.user.findFirst({\n      where: { id: userId, deletedAt: null },\n      select: { growthValue: true },\n    });\n    if (!user) return 0;\n    const levels = await loadActiveMemberLevels(this.prisma);\n    const current = resolveMemberLevel(levels, user.growthValue);\n    return calculateMemberDiscountAmount(totalAmount, current?.discountRate);\n  }\n\n  private calculatePointsDeduction(baseAmount: number, availablePoints: number, requestedPoints: number) {",
              'order member discount calculator',
          )
          p.write_text(s)

          p = Path('apps/api/src/order/production-order.service.ts')
          s = p.read_text()
          s = replace_once(
              s,
              "import { SystemConfigService } from '../system-config/system-config.service';\n",
              "import { SystemConfigService } from '../system-config/system-config.service';\nimport { calculateMemberRewardPoints, loadActiveMemberLevels, reconcileMemberLevelForGrowth, resolveMemberLevel } from '../member/member-level-runtime';\n",
              'production order member imports',
          )
          s = replace_once(
              s,
              "      calculatePointsDeduction?: (\n        baseAmount: number,\n        availablePoints: number,\n        requestedPoints: number,\n      ) => {\n        availablePoints: number;\n        maxPointsDeduct: number;\n        pointsDeducted: number;\n        pointsAmount: number;\n      };",
              "      calculatePointsDeduction?: (\n        baseAmount: number,\n        availablePoints: number,\n        requestedPoints: number,\n      ) => {\n        availablePoints: number;\n        maxPointsDeduct: number;\n        pointsDeducted: number;\n        pointsAmount: number;\n      };\n      rewardCompletedOrder?: (tx: any, order: any, rewardSource: string) => Promise<number>;",
              'production order runtime reward type',
          )
          s = replace_once(
              s,
              "      typeof runtime.calculateCouponAmount !== 'function' ||\n      typeof runtime.calculateFreight !== 'function' ||\n      typeof runtime.calculatePointsDeduction !== 'function'\n",
              "      typeof runtime.calculateCouponAmount !== 'function' ||\n      typeof runtime.calculateFreight !== 'function' ||\n      typeof runtime.calculatePointsDeduction !== 'function' ||\n      typeof runtime.rewardCompletedOrder !== 'function'\n",
              'production order runtime reward availability',
          )
          s = replace_once(
              s,
              "    runtime.calculatePointsDeduction = (\n      baseAmount: number,\n      availablePoints: number,\n      requestedPoints: number,\n    ) => this.calculateProductionPointsDeduction(baseAmount, availablePoints, requestedPoints);\n",
              "    runtime.calculatePointsDeduction = (\n      baseAmount: number,\n      availablePoints: number,\n      requestedPoints: number,\n    ) => this.calculateProductionPointsDeduction(baseAmount, availablePoints, requestedPoints);\n    runtime.rewardCompletedOrder = (tx: any, order: any, rewardSource: string) =>\n      this.rewardProductionCompletedOrder(tx, order, rewardSource);\n",
              'production order install member reward',
          )
          s = replace_once(
              s,
              "  private getRuntimeConfig() {",
              "  private async rewardProductionCompletedOrder(tx: any, order: any, rewardSource: string) {\n    const existingRecord = await tx.pointsRecord.findFirst({\n      where: { source: rewardSource, sourceId: order.id },\n    });\n    if (existingRecord) return 0;\n\n    const user = await tx.user.findFirst({\n      where: { id: order.userId },\n      select: { availablePoints: true, growthValue: true, memberLevelId: true },\n    });\n    if (!user) return 0;\n\n    const levels = await loadActiveMemberLevels(tx);\n    const currentLevel = resolveMemberLevel(levels, user.growthValue);\n    const earnedPoints = calculateMemberRewardPoints(order.payAmount || 0, currentLevel?.pointsRate);\n    if (earnedPoints <= 0) return 0;\n\n    const nextGrowthValue = user.growthValue + earnedPoints;\n    await tx.user.update({\n      where: { id: order.userId },\n      data: {\n        availablePoints: { increment: earnedPoints },\n        totalPoints: { increment: earnedPoints },\n        growthValue: { increment: earnedPoints },\n      },\n    });\n    await reconcileMemberLevelForGrowth(tx, {\n      userId: order.userId,\n      currentMemberLevelId: user.memberLevelId,\n      growthValue: nextGrowthValue,\n      reason: `订单${order.orderNo || order.id.toString()}完成，成长值更新为${nextGrowthValue}`,\n      levels,\n    });\n\n    await tx.pointsRecord.create({\n      data: {\n        userId: order.userId,\n        type: 1,\n        points: earnedPoints,\n        balance: user.availablePoints + earnedPoints,\n        source: rewardSource,\n        sourceId: order.id,\n        description: `完成订单奖励${earnedPoints}积分`,\n      },\n    });\n    return earnedPoints;\n  }\n\n  private getRuntimeConfig() {",
              'production order member reward implementation',
          )
          p.write_text(s)

          p = Path('apps/api/src/coupon/coupon.service.ts')
          s = p.read_text()
          s = replace_once(
              s,
              "import { UpdateCouponDto } from './dto/update-coupon.dto';\n",
              "import { UpdateCouponDto } from './dto/update-coupon.dto';\nimport { loadActiveMemberLevels, reconcileMemberLevelForGrowth, resolveMemberLevel } from '../member/member-level-runtime';\n",
              'coupon member imports',
          )
          s = replace_once(
              s,
              "    const [user, coupons, isNewCustomer] = await Promise.all([\n      this.prisma.user.findFirst({\n        where: { id: userIdValue, deletedAt: null },\n        select: { id: true, memberLevelId: true },\n      }),",
              "    const [user, coupons, isNewCustomer, levels] = await Promise.all([\n      this.prisma.user.findFirst({\n        where: { id: userIdValue, deletedAt: null },\n        select: { id: true, memberLevelId: true, growthValue: true },\n      }),",
              'coupon available user level inputs',
          )
          s = replace_once(
              s,
              "      this.isNewCustomer(userIdValue),\n    ]);\n    if (!user) throw new NotFoundException('用户不存在');\n\n    const result: any[] = [];",
              "      this.isNewCustomer(userIdValue),\n      loadActiveMemberLevels(this.prisma),\n    ]);\n    if (!user) throw new NotFoundException('用户不存在');\n    const currentMemberLevelId = resolveMemberLevel(levels, user.growthValue)?.id ?? user.memberLevelId;\n\n    const result: any[] = [];",
              'coupon available resolve member level',
          )
          s = replace_once(
              s,
              "      if (coupon.memberLevelId && coupon.memberLevelId !== user.memberLevelId) continue;",
              "      if (coupon.memberLevelId && coupon.memberLevelId !== currentMemberLevelId) continue;",
              'coupon available membership compare',
          )
          s = replace_once(
              s,
              "      const user = await tx.user.findUnique({\n        where: { id: userIdValue },\n        select: { memberLevelId: true },\n      });\n      if (!user) throw new NotFoundException('用户不存在');\n      if (coupon.memberLevelId && coupon.memberLevelId !== user.memberLevelId) {",
              "      const user = await tx.user.findUnique({\n        where: { id: userIdValue },\n        select: { memberLevelId: true, growthValue: true },\n      });\n      if (!user) throw new NotFoundException('用户不存在');\n      const levels = await loadActiveMemberLevels(tx);\n      const currentMemberLevel = resolveMemberLevel(levels, user.growthValue);\n      const currentMemberLevelId = currentMemberLevel?.id ?? user.memberLevelId;\n      if (currentMemberLevel && currentMemberLevel.id !== user.memberLevelId) {\n        await reconcileMemberLevelForGrowth(tx, {\n          userId: userIdValue,\n          currentMemberLevelId: user.memberLevelId,\n          growthValue: user.growthValue,\n          reason: '领取会员优惠券前同步会员等级',\n          levels,\n        });\n      }\n      if (coupon.memberLevelId && coupon.memberLevelId !== currentMemberLevelId) {",
              'coupon receive current membership',
          )
          p.write_text(s)

          p = Path('apps/api/src/payment/point-conserving-payment.service.ts')
          s = p.read_text()
          s = replace_once(
              s,
              "import { calculateRefundPointTargets } from './refund-points-conservation';\n",
              "import { calculateRefundPointTargets } from './refund-points-conservation';\nimport { loadActiveMemberLevels, reconcileMemberLevelForGrowth } from '../member/member-level-runtime';\n",
              'refund member imports',
          )
          s = replace_once(
              s,
              "        select: { availablePoints: true },\n",
              "        select: { availablePoints: true, growthValue: true, memberLevelId: true },\n",
              'refund user growth selection',
          )
          marker = "      const targets = calculateRefundPointTargets({\n        payAmount: order.payAmount,\n        cumulativeRefundAmount,\n        originalDeductedPoints: Math.max(0, order.pointsDeducted),\n        originalRewardPoints,\n      });\n"
          replacement = marker + "\n      const existingConservationTask = await tx.paymentCompensationTask.findFirst({\n        where: {\n          orderNo: order.orderNo,\n          reason: REFUND_POINTS_CONSERVATION_REASON,\n          transactionId,\n        },\n        select: { callbackPayload: true },\n      });\n      const previousPayload = existingConservationTask?.callbackPayload && typeof existingConservationTask.callbackPayload === 'object'\n        ? existingConservationTask.callbackPayload as Record<string, unknown>\n        : {};\n      let clawedGrowthValue = Math.max(0, Number(previousPayload.clawedGrowthValue || 0));\n      const growthClawbackDue = Math.max(0, targets.clawbackRewardTarget - clawedGrowthValue);\n      let clawedGrowthDelta = 0;\n      if (growthClawbackDue > 0) {\n        clawedGrowthDelta = Math.min(user.growthValue, growthClawbackDue);\n        if (clawedGrowthDelta > 0) {\n          await tx.user.update({\n            where: { id: order.userId },\n            data: { growthValue: { decrement: clawedGrowthDelta } },\n          });\n          clawedGrowthValue += clawedGrowthDelta;\n          const nextGrowthValue = user.growthValue - clawedGrowthDelta;\n          const levels = await loadActiveMemberLevels(tx);\n          await reconcileMemberLevelForGrowth(tx, {\n            userId: order.userId,\n            currentMemberLevelId: user.memberLevelId,\n            growthValue: nextGrowthValue,\n            reason: `订单${order.orderNo}累计退款，成长值回退至${nextGrowthValue}`,\n            levels,\n          });\n        }\n      }\n      const outstandingGrowthClawback = Math.max(\n        0,\n        targets.clawbackRewardTarget - clawedGrowthValue,\n      );\n"
          s = replace_once(s, marker, replacement, 'refund cumulative growth target')
          s = replace_once(
              s,
              "        outstandingRewardClawback,\n      };\n\n      if (outstandingRewardClawback > 0) {",
              "        outstandingRewardClawback,\n        growthClawbackTarget: targets.clawbackRewardTarget,\n        clawedGrowthValue,\n        outstandingGrowthClawback,\n      };\n\n      if (outstandingRewardClawback > 0 || outstandingGrowthClawback > 0) {",
              'refund conservation payload growth',
          )
          s = replace_once(
              s,
              "      return { restoredDelta: restoreDelta, clawedDelta, outstandingRewardClawback };",
              "      return {\n        restoredDelta: restoreDelta,\n        clawedDelta,\n        clawedGrowthDelta,\n        outstandingRewardClawback,\n        outstandingGrowthClawback,\n      };",
              'refund conservation return growth',
          )
          s = replace_once(
              s,
              "    const outstanding = Number(payload.outstandingRewardClawback || 0);\n",
              "    const outstanding = Number(payload.outstandingRewardClawback || 0);\n    const outstandingGrowth = Number(payload.outstandingGrowthClawback || 0);\n",
              'refund pending growth amount',
          )
          s = replace_once(
              s,
              "      resolution: `订单完成奖励积分仍有${outstanding}积分待自动扣回；用户余额不足时持续重试`,",
              "      resolution: `订单完成奖励积分仍有${outstanding}积分、成长值仍有${outstandingGrowth}待回退；未收敛时持续重试`,",
              'refund pending resolution growth',
          )
          s = replace_once(
              s,
              "      resolution: '累计成功退款金额与抵扣积分返还、订单完成奖励扣回已严格守恒',",
              "      resolution: '累计成功退款金额与抵扣积分返还、订单完成奖励积分及成长值扣回已严格守恒',",
              'refund resolved resolution growth',
          )
          p.write_text(s)
          PY

      - name: Commit source patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "openai-codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-member-benefits-patch.yml
          git add apps/api/src/order/order.service.ts apps/api/src/order/production-order.service.ts apps/api/src/coupon/coupon.service.ts apps/api/src/payment/point-conserving-payment.service.ts
          git diff --check
          git diff --cached --quiet && { echo "No patch generated" >&2; exit 1; }
          git commit -m "fix: close member benefits accounting chain"
          git push origin HEAD:agent/production-operation-closure-20260807
