name: Cleanup CI Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/polish-miniapp-ui
          fetch-depth: 0

      - name: Restore release workflow and remove temporary diagnostics
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/release-check.yml
          rm -f .github/workflows/api-lint-diagnostic.yml
          rm -f .github/workflows/source-snapshot-diagnostic.yml
          rm -f .github/workflows/apply-ci-baseline-fixes.yml
          rm -f deploy/scripts/apply-ci-baseline-fixes.py

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(ci): remove temporary diagnostics"
          git push origin HEAD:agent/polish-miniapp-ui
