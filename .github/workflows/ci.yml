name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: baby_mall_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PRISMA_SKIP_POSTINSTALL_GENERATE: true
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/baby_mall_test

    strategy:
      matrix:
        node-version: [22.13.0]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false
          standalone: true

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @baby-mall/shared build

      - name: Prisma validate
        run: pnpm --filter @baby-mall/api prisma:validate

      - name: Generate Prisma Client
        run: pnpm --filter @baby-mall/api prisma:generate

      - name: Apply migrations to CI MySQL
        run: pnpm --filter @baby-mall/api prisma:migrate:deploy

      - name: Verify migration-built database matches Prisma schema
        run: pnpm --filter @baby-mall/api prisma:migrate:drift-check

      - name: Audit runtime configuration contracts
        run: pnpm audit:runtime

      - name: Audit frontend-backend API contracts
        run: pnpm audit:api-contracts

      - name: Validate deployment shell scripts
        run: bash -n deploy/scripts/deploy-production.sh deploy/scripts/deploy-prod-check.sh deploy/scripts/smoke-runtime.sh

      - name: Run Admin operation contract tests
        run: pnpm test:admin

      - name: Run API tests (unit + mocked HTTP e2e)
        run: pnpm --filter @baby-mall/api test:ci

      - name: Run API integration tests against real MySQL
        run: pnpm --filter @baby-mall/api test:integration

      - name: Run Miniprogram unit/component tests
        run: pnpm --filter @baby-mall/miniprogram test

      - name: Build API
        id: build-api
        run: |
          set +e
          pnpm build:api > api-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 200 api-build.log
            exit "$status"
          fi
          cat api-build.log

      - name: Preserve API build failure diagnostics
        if: failure() && steps.build-api.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: api-build-failure-log
          path: api-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Build Admin Web
        id: build-admin
        run: |
          set +e
          pnpm build:admin > admin-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 200 admin-build.log
            exit "$status"
          fi
          cat admin-build.log

      - name: Preserve Admin build failure diagnostics
        if: failure() && steps.build-admin.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: admin-build-failure-log
          path: admin-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Run Admin browser operation flow
        run: pnpm test:admin:browser

      - name: Build Miniprogram
        id: build-mini
        run: |
          set +e
          VITE_API_BASE_URL=https://example.invalid/api pnpm build:mini > mini-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 200 mini-build.log
            exit "$status"
          fi
          cat mini-build.log

      - name: Preserve Miniprogram build failure diagnostics
        if: failure() && steps.build-mini.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mini-build-failure-log
          path: mini-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Build production Docker image
        run: >-
          docker build --pull
          --file deploy/Dockerfile.api
          --tag baby-mall-api:ci
          --build-arg BUILD_SHA=${{ github.sha }}
          .
