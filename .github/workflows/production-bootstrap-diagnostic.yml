name: Production Bootstrap Diagnostic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Validate bootstrap shell syntax
        run: bash -n deploy/scripts/ci-production-bootstrap.sh

      - name: Build final production image
        run: >-
          docker build --pull
          --file deploy/Dockerfile.api
          --tag baby-mall-api:bootstrap-ci
          --build-arg BUILD_SHA=${{ github.sha }}
          .

      - name: Boot production image against empty MySQL and Redis
        env:
          IMAGE_TAG: baby-mall-api:bootstrap-ci
          BUILD_SHA: ${{ github.sha }}
        run: bash deploy/scripts/ci-production-bootstrap.sh

      - name: Preserve production bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-bootstrap-diagnostics
          path: |
            production-bootstrap-api.log
            production-bootstrap-health.json
          if-no-files-found: warn
          retention-days: 2
