name: Apply Order Video Font Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/order-video-font-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/order-video-font-audit
          fetch-depth: 0

      - name: Apply deterministic source changes
        run: python3 scripts/apply-order-video-font-fixes.py

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare generated packages
        run: pnpm prepare:ci

      - name: Run focused API tests
        run: pnpm --filter @baby-mall/api exec jest --runInBand --runTestsByPath src/product/product.service.spec.ts src/payment/payment-description.spec.ts

      - name: Run native-control regression test
        run: pnpm --filter @baby-mall/miniprogram exec vitest run --config vitest.config.ts src/__tests__/native-control-safety.spec.ts

      - name: Typecheck API, admin and miniprogram
        run: pnpm typecheck

      - name: Re-run native control audit
        run: python3 scripts/audit-native-controls.py

      - name: Validate diff whitespace
        run: git diff --check

      - name: Remove temporary automation files
        run: |
          rm -f scripts/apply-order-video-font-fixes.py
          rm -f scripts/audit-native-controls.py
          rm -f .github/workflows/apply-order-video-font-fixes.yml
          rm -f .github/workflows/native-control-audit.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: integrate order path, local videos and native control safety"
          git push origin HEAD:fix/order-video-font-audit
