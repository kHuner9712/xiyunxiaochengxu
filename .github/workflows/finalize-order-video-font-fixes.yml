name: Finalize Order Video Font Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/order-video-font-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/order-video-font-audit
          fetch-depth: 0

      - name: Update regression expectations and formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          unit_path = Path('apps/api/src/upload/upload.service.spec.ts')
          text = unit_path.read_text(encoding='utf-8')
          text = text.replace('UPLOAD_MAX_SIZE 默认值为 10MB', 'UPLOAD_MAX_SIZE 默认值为 50MB')
          text = text.replace('expect(getUploadMaxSize()).toBe(10485760);', 'expect(getUploadMaxSize()).toBe(52428800);')
          unit_path.write_text(text, encoding='utf-8')

          e2e_path = Path('apps/api/test/upload-limits.e2e-spec.ts')
          e2e = e2e_path.read_text(encoding='utf-8')
          e2e = e2e.replace('Buffer.alloc(10485761)', 'Buffer.alloc(52428801)')
          e2e_path.write_text(e2e, encoding='utf-8')

          payment_path = Path('apps/api/src/payment/payment.service.ts')
          payment = payment_path.read_text(encoding='utf-8')
          payment = payment.replace(
              "            include: {\n          user: { select: { id: true, openid: true } },\n          orderItems: { select: { productName: true, quantity: true } },\n        },\n",
              "            include: {\n              user: { select: { id: true, openid: true } },\n              orderItems: { select: { productName: true, quantity: true } },\n            },\n",
          )
          payment_path.write_text(payment, encoding='utf-8')

          activity_test = Path('apps/miniprogram/src/pages/activity/__tests__/detail-contract.spec.ts')
          activity = activity_test.read_text(encoding='utf-8')
          activity = activity.replace("toContain('已售12件')", "toContain('已售 12 件')")
          activity_test.write_text(activity, encoding='utf-8')

          zero_pay_test = Path('apps/miniprogram/src/pages/order/__tests__/zero-pay-flow.spec.ts')
          zero_pay = zero_pay_test.read_text(encoding='utf-8')
          zero_pay = zero_pay.replace(
              "  ;(globalThis as any).uni = {\n    redirectTo: vi.fn(),",
              "  ;(globalThis as any).uni = {\n    getStorageSync: vi.fn(() => ''),\n    redirectTo: vi.fn(),",
          )
          zero_pay_test.write_text(zero_pay, encoding='utf-8')
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare generated packages
        run: pnpm prepare:ci

      - name: Run upload regression tests
        run: |
          pnpm --filter @baby-mall/api exec jest --config jest.config.js --runInBand --runTestsByPath src/upload/upload.service.spec.ts
          pnpm --filter @baby-mall/api exec jest --config test/jest-e2e.config.js --runInBand --runTestsByPath test/upload-limits.e2e-spec.ts

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run miniprogram tests
        run: pnpm --filter @baby-mall/miniprogram test

      - name: Validate diff
        run: git diff --check

      - name: Remove temporary workflow
        run: rm -f .github/workflows/finalize-order-video-font-fixes.yml

      - name: Commit final validation fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align upload and miniprogram regressions"
          git push origin HEAD:fix/order-video-font-audit
